# Example config for MizuBot
discord_token: "Bot <your_token_here>"
database_path: "./reminders.db"
tick_interval: "10s"
anime:
  poll_interval: "1m"
  feed_url: "https://nyaa.si/?page=rss&c=1_2&f=0"
  public_feed_base_url: "https://feeds.example.com"
  bucket: "mizubot-anime-feeds"
  prefix: "anime"
aws:
  s3_access_key: "AKIA..."
  s3_secret_key: "secret"
  s3_region: "ap-south-1"
llm:
  base_url: "http://localhost:8080" # OpenAI-compatible endpoint, e.g. a Bifrost gateway; "/v1" is appended automatically if missing
  model: "llama3.2"
  api_key: ""     # optional, forwarded as a Bearer token
  timeout: "60s"

# Optional
env: "test"            # or "prod"
test_guild_id: "123456789012345678"
dry_run: true          # log sends instead of posting
# Optional: logs the conversation history path (reply-chain vs channel-buffer),
# message count, and each history message (author + truncated content) sent
# to the LLM for every request. Off by default to avoid log spam.
llm_debug_history: false
# Optional: a single Discord user ID that may always run /edit-prompt, regardless
# of their server permissions. Override with OWNER_DISCORD_ID.
owner_discord_id: "123456789012345678"
# Optional: seeded into the guild_instructions DB table at startup.
# /edit-prompt writes to the same table, so anything set here is a starting
# value that server admins and mods can then change from Discord.
guild_instructions:
  "123456789012345678": |
    Extra rules for this server only.
    If a user asks about a banned topic, refuse clearly and follow this server's tone.
